name: Full Security & Quality Scans

on:
  push:
  pull_request:

jobs:
  full-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      matrix:
        language: ['python']

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install Python tools
        run: |
          pip install flask flake8 bandit safety semgrep

      # 4️⃣ Install Bearer CLI
      - name: Install Bearer CLI
        run: |
          curl -sSL https://cli.bearer.sh/install.sh | bash
          export PATH=$HOME/.bearer/bin:$PATH

      # 6️⃣ Flake8 lint
      - name: Flake8 lint
        run: |
          flake8 . --format=html --htmldir=flake8-report || true

      # 7️⃣ Bandit security scan
      - name: Bandit scan
        run: |
          bandit -r . -f html -o bandit-report.html || true

      # 8️⃣ Safety dependency scan
      - name: Safety dependency scan
        run: |
          safety check --full-report > safety-report.txt || true

      # 9️⃣ Semgrep scan
      - name: Semgrep scan
        run: |
          semgrep --config=auto --json --output semgrep-report.json || true

      # 🔟 Bearer CLI scan
      - name: Bearer scan
        run: |
          bearer scan --json-output bearer-report.json || true

     
      # 1️⃣2️⃣ Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # 1️⃣3️⃣ CodeQL Autobuild
      - name: CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      # 1️⃣4️⃣ CodeQL analyze
      - name: CodeQL analyze
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results

      # 1️⃣5️⃣ Upload all scan reports
      - name: Upload all scan reports
        uses: actions/upload-artifact@v4
        with:
          name: full-security-reports
          path: |
            flake8-report/
            bandit-report.html
            safety-report.txt
            semgrep-report.json
            bearer-report.json
            codeql-results
